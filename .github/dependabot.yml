version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/bullMQ"
    schedule:
      interval: "weekly"
    groups:
      root-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
